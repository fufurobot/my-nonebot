name: CI

# Branch model (see README):
#   dev  -> fast tests only: lint on one Python plus a single-version test run.
#           It is the integration branch and is allowed to be red; the point is
#           a quick signal, not a gate.
#   main -> the full matrix (3.10-3.13), the config/secret gate, and the
#           packaging check. Merging to main means "this is releasable".
#
# Read-only: this workflow only verifies code, it never publishes or writes
# back to the repository. Publishing lives in release.yml.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src/plugins/chessbot tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dev gets one interpreter so the feedback loop stays fast; main runs
        # the full supported range (the project requires >=3.10,<4.0).
        # `include`/`exclude` keep this declarative: every version is listed,
        # and all but the newest are excluded off main.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude: >-
          ${{
            github.ref == 'refs/heads/main'
              && fromJSON('[]')
              || fromJSON('[{"python-version": "3.10"}, {"python-version": "3.11"}, {"python-version": "3.12"}]')
          }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run tests
        env:
          ENVIRONMENT: test
          DRIVER: "~none"
        run: uv run pytest tests -q

  config:
    # The config and secret gates only run on main: they protect what is about
    # to be released, and dev is explicitly allowed to be red.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Validate deployment config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Assert .env.example exists and has no secrets
        run: uv run pytest tests/test_ci_config.py -q

      - name: Fail if a credential-shaped string is committed
        run: |
          set -euo pipefail
          # Scan tracked files only; the pattern list mirrors tests/test_ci_config.py.
          if git grep -nIE 'github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|glpat-[A-Za-z0-9_-]{15,}' -- .; then
            echo "::error::a credential-shaped string is committed to the repository"
            exit 1
          fi
          echo "no credentials found in tracked files"

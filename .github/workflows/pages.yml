name: Pages

# The bot has no browser UI -- it is driven entirely from QQ -- so the Pages
# site is the project documentation: the README rendered as a landing page,
# plus the board-format reference. That is the only thing in this repository a
# visitor can usefully read outside of GitHub itself.
#
# Runs on main only, because Pages is the published surface for a release.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Render the site
        run: uv run python .github/scripts/build_site.py

      # Enabling Pages is a one-time repository setting, and the REST endpoint
      # for it needs the token to carry the `pages: write` permission -- which
      # a CI token generally does not. Probing here means a repository that has
      # not enabled Pages yet reports a clear reason instead of failing later
      # with an opaque `configure-pages` error.
      - name: Check whether Pages is enabled
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"); then
            if [ "$code" = "200" ]; then
              echo "enabled=true" >>"$GITHUB_OUTPUT"
            else
              echo "enabled=false" >>"$GITHUB_OUTPUT"
              echo "::notice title=GitHub Pages is not enabled::Enable it under Settings > Pages and set Source to \"GitHub Actions\", then re-run this workflow. (The API returned HTTP $code.)"
            fi
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages status unknown::Could not query the Pages API; skipping deployment."
          fi

      - name: Configure Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
